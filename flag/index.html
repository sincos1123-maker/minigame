*{box-sizing:border-box;margin:0;font-family:"Pretendard","Malgun Gothic","맑은 고딕",sans-serif}
body{background:var(--paper);background-image:radial-gradient(#d5dcea 1.2px,transparent 1.2px);background-size:22px 22px;color:var(--ink);min-height:100vh;display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;color:var(--ink)}
button:focus-visible,input:focus-visible{outline:4px solid var(--t2);outline-offset:3px}
header{display:flex;gap:10px;padding:14px 24px;align-items:center;flex-wrap:wrap;background:#fff;border-bottom:3px solid var(--ink)}
header h1{font-size:24px;font-weight:900;letter-spacing:-.02em;margin-right:auto}
.team{display:flex;align-items:baseline;gap:10px;padding:6px 14px;border-radius:12px;border:2px solid var(--line);background:#fff}
.team b{font-size:16px;font-weight:800}.team span{font-size:28px;font-weight:900;color:var(--ink);min-width:1.2em;text-align:right}
.team.on{border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);transform:translateY(-2px)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px;gap:20px;text-align:center}
.hide{display:none!important}
/* 설정 화면 */
.panel{background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:28px 30px;width:min(760px,100%);text-align:left;display:flex;flex-direction:column;gap:18px}
.ptitle{font-size:30px;font-weight:900;letter-spacing:-.02em}
.field{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:14px}
.flabel{font-size:18px;font-weight:800}
.seg{display:inline-flex;flex-wrap:wrap;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:#fff;justify-self:start}
.seg .pick{border:0;border-right:2px solid var(--ink);background:transparent;padding:10px 18px;font-size:19px;font-weight:700}
.seg .pick:last-child{border-right:0}
.seg .pick.sel{background:var(--ink);color:#fff}
.timefield{display:flex;align-items:center;gap:8px}
.step{border:3px solid var(--ink);background:#fff;border-radius:12px;width:58px;height:50px;font-size:18px;font-weight:800}
#tInput{width:110px;height:50px;font:inherit;font-size:28px;font-weight:900;text-align:center;border:3px solid var(--ink);border-radius:12px;color:var(--ink)}
.unit{font-size:20px;font-weight:800}
.link{background:none;border:0;font-size:16px;font-weight:700;text-decoration:underline;text-underline-offset:4px;color:#525a85;padding:6px}
.link.danger{color:var(--warn)}
.start{margin-top:6px;border:3px solid var(--ink);border-radius:16px;background:var(--t1);color:#fff;font-size:30px;font-weight:900;padding:16px;box-shadow:0 6px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.start:active,.act:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.meta{font-size:15px;color:#525a85}
.under{display:flex;gap:18px}
.keys{font-size:14px;color:#525a85}
kbd{display:inline-block;border:2px solid var(--ink);border-bottom-width:4px;border-radius:6px;padding:0 6px;margin:0 2px 0 6px;font:inherit;font-weight:800;background:#fff}
/* 진행 화면 */
#play{justify-content:flex-start;padding-top:0;gap:14px}
.timebar{align-self:stretch;height:14px;background:#dfe5f0;border-bottom:3px solid var(--ink);margin:0 -20px}
.timebar i{display:block;height:100%;width:100%;transition:width 1s linear}
.stagehead{display:flex;align-items:center;justify-content:space-between;width:min(980px,100%);margin-top:10px}
.who{font-size:30px;font-weight:900;min-width:180px;text-align:left}
#timer{font-size:76px;font-weight:900;line-height:1;letter-spacing:-.03em}
#timer.warn{color:var(--warn)}
.tally{font-size:22px;font-weight:700;min-width:180px;text-align:right}.tally b{font-size:30px;font-weight:900;margin:0 10px 0 4px}
#cat{font-size:20px;font-weight:800;color:#fff;padding:6px 18px;border-radius:99px;background:var(--ink)}
#card{background:#fff;border:4px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink);width:min(940px,100%);min-height:40vh;display:flex;align-items:center;justify-content:center;padding:24px;font-size:clamp(48px,11vw,150px);font-weight:900;letter-spacing:-.03em;white-space:pre-line;line-height:1.15}
#card.small{font-size:clamp(32px,6vw,84px)}
.actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.act{border:3px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);font-size:30px;font-weight:900;padding:16px 0;width:220px;transition:transform .08s,box-shadow .08s}
.act.ok{background:var(--ok);color:#fff}.act.pass{background:var(--pass)}.act.hint{background:#fff}
.act:disabled{opacity:.35;cursor:default;box-shadow:0 6px 0 var(--ink)}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tool{background:none;border:2px solid transparent;border-radius:10px;font-size:16px;font-weight:700;color:#525a85;padding:6px 12px}
.tool:hover{border-color:var(--line);background:#fff}
#log{font-size:20px;line-height:1.8;max-width:900px}
#log s{opacity:.45}
/* 결과 화면 */
#result .panel{text-align:center;align-items:center}
#rTitle{font-size:56px;font-weight:900;letter-spacing:-.03em}
#rStat{font-size:24px;font-weight:700}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
#award{gap:10px;justify-content:flex-start;padding-top:18px}
.awTitle{font-size:46px;font-weight:900;letter-spacing:-.03em}
.podium{display:flex;align-items:flex-end;gap:16px;justify-content:center}
.pod{display:flex;flex-direction:column;align-items:center;width:170px}
.blk{width:100%;border:3px solid var(--ink);border-bottom:0;border-radius:16px 16px 0 0;color:#fff;font-weight:900;display:flex;flex-direction:column;align-items:center;padding-top:10px;font-size:28px}
.blk small{font-size:17px;font-weight:700;margin-top:2px}
.podium::after{content:none}
.bob{animation:bob .8s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-12px)}}
.tr{position:fixed;bottom:10px;width:min(210px,17vw);z-index:4}
.tr>div{animation:toot .45s ease-in-out infinite alternate;transform-origin:50% 90%}@keyframes toot{from{transform:rotate(4deg)}to{transform:rotate(-8deg) translateY(-10px)}}
.notes{position:absolute;top:10%;right:-10%;font-size:34px;animation:fly 1.4s linear infinite}@keyframes fly{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(50px,-130px) rotate(30deg)}}
#rank{border-collapse:separate;border-spacing:0;font-size:22px;background:#fff;border:3px solid var(--ink);border-radius:16px;overflow:hidden;min-width:min(480px,90vw);box-shadow:0 6px 0 var(--ink)}
#rank th{background:var(--ink);color:#fff;padding:9px 24px;font-size:16px;font-weight:700}#rank td{padding:5px 24px;border-top:2px solid #e3e8f1}
#rank tr.gold td{background:#FFF3CF;font-weight:900}
#teamLine{font-size:20px;font-weight:700;background:#fff;padding:8px 20px;border-radius:99px;border:2px solid var(--line)}
.awBtns{display:flex;gap:12px;align-items:center}
.awBtns .start{font-size:22px;padding:12px 28px;background:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#card{width:auto;min-height:0;padding:14px}
#card img{display:block;width:min(560px,80vw,calc(33vh*4/3));aspect-ratio:4/3;object-fit:cover;border-radius:12px;border:2px solid #e3e8f1}
#hintTxt{font-size:26px;font-weight:800;min-height:34px}
#hintTxt:empty{visibility:hidden}
#flash{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:6px;background:#F2F5FAee;z-index:8;font-size:clamp(52px,9vw,112px);font-weight:900;letter-spacing:-.03em}
#flash small{font-size:28px;font-weight:700;color:#525a85;letter-spacing:0}#flash.on{display:flex;animation:fl .22s ease-out}
@keyframes fl{from{transform:scale(1.08);opacity:0}}

/* 국기 크게: 왼쪽 큰 국기 + 오른쪽 진행 정보 */
#play{padding:0 24px 18px;gap:0}
.stage{flex:1;width:100%;max-width:1600px;display:grid;grid-template-columns:1fr minmax(260px,320px);gap:28px;align-items:center;padding-top:16px}
.flagcol{display:flex;justify-content:center;min-width:0}
#card{width:auto;min-height:0;padding:12px}
#card img{display:block;width:min(calc(100vw - 430px),calc((100vh - 182px)*4/3));max-width:none;aspect-ratio:4/3;object-fit:cover;border-radius:12px;border:2px solid #e3e8f1}
.flagcol #card{max-width:100%}
.side{display:flex;flex-direction:column;align-items:stretch;gap:12px;text-align:center}
.side .who{text-align:center;min-width:0}
.side #timer{font-size:80px}
.side .tally{text-align:center;min-width:0}
.side #cat{align-self:center}
.side #hintTxt{font-size:22px;min-height:30px}
.side .actions{flex-direction:column;gap:10px;margin-top:2px}
.side .act{width:100%;padding:11px 0;font-size:28px}
.side .tools{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:0}
@media (max-width:900px){.stage{grid-template-columns:1fr}#card img{width:min(calc(100vw - 72px),620px)}.side .actions{flex-direction:row;flex-wrap:wrap}.side .act{flex:1}}
</style></head><body>
<header>
  <h1>국기 맞추기</h1>
  <div id="board" style="display:contents"></div>
</header>

<main id="setup">
  <section class="panel">
    <h2 class="ptitle">게임 설정</h2>
    <div class="field"><span class="flabel">조 개수</span><div class="seg" id="countPick"></div></div>
    <div class="field"><span class="flabel">이번 차례</span><div class="seg" id="teamPick"></div></div>
    <div class="field"><span class="flabel">제한 시간</span><div class="timefield"><button class="step" id="tMinus" aria-label="30초 줄이기">−30</button><input id="tInput" type="number" min="10" max="600" step="10" aria-label="제한 시간(초)"><span class="unit">초</span><button class="step" id="tPlus" aria-label="30초 늘리기">+30</button><button class="link" id="tDef">180초로</button></div></div>
    <div class="field"><span class="flabel">패스 제한</span><div class="seg" id="passPick"></div></div>
    <button class="start" id="bStart">시작!</button>
    <p class="meta" id="remainInfo"></p>
  </section>
  <div class="under"><button class="link" id="bHost">진행자 화면 열기</button><button class="link" id="bAward">시상식 보기</button><button class="link danger" id="bReset">점수 전체 초기화</button></div>
  <p class="meta" id="hostMsg" aria-live="polite"></p>
  <p class="keys">단축키<kbd>→</kbd> 정답<kbd>↓</kbd> 패스<kbd>H</kbd> 힌트</p>
</main>

<main id="play" class="hide">
  <div class="timebar"><i id="tbar"></i></div>
  <div class="stage">
    <div class="flagcol"><div id="card"></div></div>
    <aside class="side">
      <div class="who" id="who"></div>
      <div id="timer"></div>
      <div class="tally">정답<b id="cOk">0</b>패스<b id="cPass">0</b></div>
      <div id="cat"></div>
      <div id="hintTxt"></div>
      <div class="actions"><button class="act ok" id="bOk">정답</button><button class="act pass" id="bPass">패스</button><button class="act hint" id="bHint">힌트</button></div>
      <div class="tools"><button class="tool" id="bHost2">진행자 화면</button><button class="tool" id="bPeek">정답 확인 (누르고 있는 동안)</button><button class="tool" id="bBgm"></button><button class="tool" id="bStop">이번 차례 끝내기</button></div>
    </aside>
  </div>
  <div id="flash"></div>
</main>

<main id="award" class="hide">
  <div class="awTitle">시상식</div>
  <div id="teamLine"></div>
  <div class="podium" id="podium"></div>
  <table id="rank"></table>
  <div class="awBtns"><button class="link" id="bAwBgm"></button><button class="link" id="bAwBack">돌아가기</button><button class="start" id="bAwNew">새 게임 시작</button></div>
</main>
<canvas id="fx"></canvas>
<div class="tr" id="trLw" style="left:10px"><div id="trL"></div><span class="notes">♪</span></div>
<div class="tr" id="trRw" style="right:10px;transform:scaleX(-1)"><div id="trR"></div><span class="notes">♫</span></div>
<main id="result" class="hide">
  <section class="panel">
    <div id="rTitle"></div>
    <div id="rStat"></div>
    <div id="log"></div>
    <button class="start" id="bNext" style="align-self:stretch;background:var(--ink)">다음 조 준비</button>
  </section>
</main>

const $=id=>document.getElementById(id);
let st={teams:4,team:1,prov:[],sec:180,bgm:true,time:60,passMax:3,score:[0,0,0,0],used:[],played:[],seen:[]};
try{const s=JSON.parse(localStorage.getItem("flaggame"));if(s)Object.assign(st,s)}catch(e){}
const save=()=>{try{localStorage.setItem("flaggame",JSON.stringify(st))}catch(e){}};
let deck=[],cur=null,left=0,tick=null,ok=0,pass=0,log=[];

function picks(el,items,key,fmt){$(el).innerHTML="";items.forEach(v=>{const b=document.createElement("button");b.className="pick"+(st[key]===v?" sel":"");b.textContent=fmt?fmt(v):v;b.onclick=()=>{st[key]=v;save();drawSetup()};$(el).appendChild(b)})}
const CATC={"아시아":"#F0453A","유럽":"#2F7BF5","아메리카":"#14A06F","아프리카":"#F08A24","오세아니아":"#0FA3B5"};
const ALL=FLAGS.map(f=>({w:f.k,c:f.c,e:f.e,i:f.i}));
const PROV=[];
function drawSetup(){
 while(st.score.length<6)st.score.push(0);if(st.team>st.teams)st.team=1;
 picks("countPick",[2,3,4,5,6],"teams",v=>v+"개 조");
 picks("teamPick",Array.from({length:st.teams},(_,i)=>i+1),"team",v=>v+"조");
 $("remainInfo").textContent=`남은 국기 ${ALL.filter(x=>!st.used.includes(x.w)).length}개 / 전체 ${ALL.length}개`;
 picks("passPick",[1,2,3,99],"passMax",v=>v===99?"무제한":v+"번");
 $("tInput").value=st.sec;drawScore();}
function drawScore(){$("board").innerHTML=Array.from({length:st.teams},(_,k)=>`<div class="team${k+1===st.team?" on":""}"><b style="color:var(--t${k+1})">${k+1}조</b><span>${st.score[k]}</span></div>`).join("")}
function show(id){["setup","play","result","award"].forEach(x=>$(x).classList.toggle("hide",x!==id));["trLw","trRw","fx"].forEach(x=>$(x).classList.toggle("hide",id!=="award"));if(id!=="award"&&typeof awardStop==="function")awardStop()}
// 무작위 섞기: 매 판마다 남은 국기 전체를 섞은 뒤, 같은 주제가 연달아 나오지 않게 순서를 조정
function rnd(n){try{const u=new Uint32Array(1);crypto.getRandomValues(u);return u[0]%n}catch(e){return Math.floor(Math.random()*n)}}
// 섞기 알고리즘: ① 아직 화면에 한 번도 안 나온 단어를 앞에(무작위) ② 이미 나왔던 단어(패스·중단)는 뒤로(무작위) ③ 같은 주제 연속 방지
function mix2(a){const fresh=a.filter(x=>!st.seen.includes(x.w)),old=a.filter(x=>st.seen.includes(x.w));
 if(!fresh.length){st.seen=[];save();return mix(a)}return mix(fresh).concat(mix(old))}
function mix(a){a=shuffle(a.slice());for(let i=1;i<a.length;i++){if(a[i].c===a[i-1].c){const j=a.findIndex((x,k)=>k>i&&x.c!==a[i-1].c);if(j>0)[a[i],a[j]]=[a[j],a[i]]}}return a}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}

let ac;function beep(f,d){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.value=.2;o.start();o.stop(ac.currentTime+d)}catch(e){}}

// ===== 긴장감 BGM: Web Audio로 직접 합성한 자작 음원 (외부 음원 없음 → 저작권 문제 없음) =====
let bgmT=null,nextT=0,step=0,noise=null;
const BASS=[110,110,130.8,110,82.4,110,87.3,103.8];
function bpm(){return left>30?120:left>10?145:175}
function bgmNote(t,i){
 const o=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();
 o.type="square";o.frequency.value=BASS[i%8]*(left<=10&&i%2?2:1);f.type="lowpass";f.frequency.value=700;
 g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);
 o.connect(f);f.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.2);
 const n=ac.createBufferSource(),hf=ac.createBiquadFilter(),ng=ac.createGain();
 n.buffer=noise;hf.type="highpass";hf.frequency.value=7000;
 ng.gain.setValueAtTime(i%2?.03:.06,t);ng.gain.exponentialRampToValueAtTime(.001,t+.05);
 n.connect(hf);hf.connect(ng);ng.connect(ac.destination);n.start(t);n.stop(t+.06);
 if(i%4===0){const k=ac.createOscillator(),kg=ac.createGain();k.frequency.setValueAtTime(120,t);k.frequency.exponentialRampToValueAtTime(40,t+.15);
  kg.gain.setValueAtTime(.35,t);kg.gain.exponentialRampToValueAtTime(.001,t+.2);k.connect(kg);kg.connect(ac.destination);k.start(t);k.stop(t+.22)}}
function bgmStart(){if(!st.bgm||bgmT)return;try{ac=ac||new AudioContext();ac.resume();
 if(!noise){noise=ac.createBuffer(1,ac.sampleRate*.1,ac.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
 step=0;nextT=ac.currentTime+.05;
 bgmT=setInterval(()=>{while(nextT<ac.currentTime+.12){bgmNote(nextT,step++);nextT+=30/bpm()}},25)}catch(e){}}
function bgmStop(){clearInterval(bgmT);bgmT=null}
function drawBgm(){$("bBgm").textContent=st.bgm?"음악 끄기":"음악 켜기"}

function start(){
 deck=mix2(ALL.filter(x=>!st.used.includes(x.w)));
 if(!st.prov.includes(st.team)){const p=shuffle(PROV.filter(x=>!st.used.includes(x.w)))[0];if(p){deck.splice(Math.floor(Math.random()*Math.min(5,deck.length+1)),0,p);st.prov.push(st.team);st.used.push(p.w);save()}}
 if(!deck.length){$("bStart").textContent="국기를 다 썼어요";setTimeout(()=>$("bStart").textContent="시작!",1500);return}
 ok=0;pass=0;log=[];left=st.sec;
 $("who").textContent=st.team+"조";$("who").style.color=`var(--t${st.team})`;$("tbar").style.background=`var(--t${st.team})`;
 show("play");drawBgm();bgmStart();next();drawTime();beep(880,.15);
 tick=setInterval(()=>{left--;drawTime();if(left<=5&&left>0)beep(660,.1);if(left<=0)end()},1000);}
function drawTime(){$("timer").textContent=left;$("timer").classList.toggle("warn",left<=10);$("tbar").style.width=Math.max(0,left/st.sec*100)+"%"}
let hintLv=0,busy=false,hm="";
function hint(){if(!cur||busy)return;hintLv++;
 if(hintLv===1){$("cat").textContent="🌏 "+cur.c;$("cat").style.background=CATC[cur.c]}
 else if(hintLv===2){$("hintTxt").textContent=`💡 첫 글자 '${cur.w[0]}' · ${cur.w.replace(/\(.*\)/,"").replace(/ /g,"").length}글자`}
 else{$("hintTxt").textContent=`💡 영어 이름: ${cur.e[0]}${"_".repeat(Math.max(0,cur.e.replace(/ /g,"").length-1))}`}
 hm=$("hintTxt").textContent;$("bHint").disabled=hintLv>=3;$("bHint").style.opacity=hintLv>=3?.35:1}
function flash(ok,then){busy=true;$("flash").innerHTML=`${ok?"✅":"➡️"} ${cur.w}<small>${cur.e}</small>`;$("flash").style.color=ok?"#3FB68E":"#8a8fa8";
 $("flash").classList.add("on");setTimeout(()=>{$("flash").classList.remove("on");busy=false;if(tick)then()},1000)}
function next(){cur=deck.shift();if(!cur){end();return}
 hintLv=0;hm="";$("hintTxt").textContent="";$("bHint").disabled=false;$("bHint").style.opacity=1;
 if(!st.seen.includes(cur.w)){st.seen.push(cur.w);save()}
 $("card").innerHTML=`<img src="${cur.i}" alt="국기">`;
 $("cat").textContent="❓ 어느 나라 국기일까?";$("cat").style.background="var(--navy)";
 $("cOk").textContent=ok;$("cPass").textContent=pass;
 $("bPass").disabled=pass>=st.passMax;$("bPass").style.opacity=pass>=st.passMax?.35:1;}
function correct(){if(!cur||busy)return;ok++;st.score[st.team-1]++;if(!st.used.includes(cur.w))st.used.push(cur.w);log.push(cur.w.replace("\n"," "));save();drawScore();beep(1200,.12);flash(true,next)}
function skip(){if(!cur||busy||pass>=st.passMax)return;pass++;log.push("<s>"+cur.w.replace("\n"," ")+"</s>");beep(300,.12);flash(false,next)}
function end(){bgmStop();clearInterval(tick);tick=null;cur=null;beep(440,.6);
 if(!st.played.includes(st.team))st.played.push(st.team);save();
 $("bNext").textContent=allDone()?"시상식 보기":"다음 조 준비";
 $("rTitle").textContent=st.team+"조 끝!";$("rStat").textContent=`정답 ${ok}개 · 패스 ${pass}개`;
 $("log").innerHTML=log.join(" · ")||"";show("result");}
const setSec=v=>{v=Math.round(+v||180);st.sec=Math.min(600,Math.max(10,v));save();$("tInput").value=st.sec};
$("tMinus").onclick=()=>setSec(st.sec-30);$("tPlus").onclick=()=>setSec(st.sec+30);$("tDef").onclick=()=>setSec(180);
$("tInput").onchange=e=>setSec(e.target.value);

 st.score=[0,0,0,0,0,0];st.used=[];st.prov=[];st.played=[];st.seen=[];armed=false;$("bReset").textContent="점수 전체 초기화";save();drawSetup()};

function allDone(){return Array.from({length:st.teams},(_,i)=>i+1).every(t=>st.played.includes(t))}
function charSVG(color,mode){ // mode: "trumpet" | "crown" | "plain"  (자작 캐릭터)
 const mouth=mode==="trumpet"?'<ellipse cx="112" cy="128" rx="7" ry="6" fill="#3a2a2a"/>':'<path d="M70 128 Q82 142 96 128" stroke="#3a2a2a" stroke-width="5" fill="none" stroke-linecap="round"/>';
 const trumpet=mode==="trumpet"?'<rect x="114" y="122" width="48" height="12" rx="4" fill="#F5C33B"/><rect x="128" y="112" width="6" height="12" fill="#E0A800"/><rect x="140" y="112" width="6" height="12" fill="#E0A800"/><path d="M160 128 L198 102 L198 154 Z" fill="#F5C33B" stroke="#E0A800" stroke-width="3"/><ellipse cx="128" cy="140" rx="12" ry="9" fill="'+color+'" stroke="#00000022" stroke-width="2"/>':'';
 const crown=mode==="crown"?'<path d="M50 62 L60 30 L76 52 L88 22 L100 52 L116 30 L126 62 Z" fill="#F5C33B" stroke="#E0A800" stroke-width="3"/>':'';
 return `<svg viewBox="0 0 200 200" width="100%"><ellipse cx="88" cy="190" rx="52" ry="7" fill="#00000018"/>
 <ellipse cx="62" cy="182" rx="14" ry="9" fill="${color}"/><ellipse cx="112" cy="182" rx="14" ry="9" fill="${color}"/>
 <ellipse cx="88" cy="122" rx="64" ry="60" fill="${color}"/><ellipse cx="70" cy="96" rx="20" ry="14" fill="#ffffff40"/>
 ${crown}<circle cx="68" cy="110" r="8" fill="#2b2b3a"/><circle cx="106" cy="110" r="8" fill="#2b2b3a"/>
 <circle cx="71" cy="107" r="3" fill="#fff"/><circle cx="109" cy="107" r="3" fill="#fff"/>
 <ellipse cx="54" cy="128" rx="9" ry="6" fill="#ff8fa3aa"/><ellipse cx="122" cy="128" rx="9" ry="6" fill="#ff8fa3aa"/>${mouth}${trumpet}</svg>`}
function award(){
 const T=Array.from({length:st.teams},(_,i)=>({t:i+1,s:st.score[i]}));
 T.forEach(x=>x.r=1+T.filter(y=>y.s>x.s).length);
 const R=[...T].sort((a,b)=>a.r-b.r||a.t-b.t);
 $("teamLine").innerHTML=T.map(x=>`<span style="color:var(--t${x.t})">${x.t}조</span> ${x.s}개`).join(" &nbsp;·&nbsp; ");
 const top=R.slice(0,3),H={1:122,2:98,3:80},order=[top[1],top[0],top[2]].filter(Boolean);
 $("podium").innerHTML=order.map((x,k)=>`<div class="pod"><div class="bob" style="width:84px;animation-delay:${k*.2}s">${charSVG(`var(--t${x.t})`,x.r===1?"crown":"plain")}</div>
  <div class="blk" style="height:${H[x.r]||100}px;background:var(--t${x.t})">${x.r}위<small>${x.t}조 · ${x.s}개</small></div></div>`).join("");
 $("rank").innerHTML="<tr><th>순위</th><th>조</th><th>맞힌 개수</th></tr>"+R.map(x=>`<tr${x.r===1?' class="gold"':""}><td>${x.r===1?"🥇":x.r===2?"🥈":x.r===3?"🥉":""} ${x.r}위</td><td style="color:var(--t${x.t});font-weight:800">${x.t}조</td><td>${x.s}개</td></tr>`).join("");
 $("trL").innerHTML=charSVG("#FF9EC4","trumpet");$("trR").innerHTML=charSVG("#7FD6F5","trumpet");
 show("award");fxStart();if(st.bgm)fanfare();drawAwBgm();}
// 폭죽 (위로 쏘아 올려 터짐) + 색종이
let fxOn=false,P=[],Rk=[],fxLast=0;
function fxStart(){const c=$("fx");c.width=innerWidth;c.height=innerHeight;fxOn=true;P=[];Rk=[];requestAnimationFrame(fxLoop)}
function fxLoop(ts){if(!fxOn){const c=$("fx");c.getContext("2d").clearRect(0,0,c.width,c.height);return}
 const c=$("fx"),g=c.getContext("2d"),W=c.width,Hh=c.height,cols=["#F96167","#F9B233","#3FB68E","#5B8DEF","#9B6BD6","#F9E795","#FF9EC4"];
 if(ts-fxLast>450){fxLast=ts;Rk.push({x:W*(.15+Math.random()*.7),y:Hh,vy:-(Hh*.011+Math.random()*4),c:cols[Math.random()*7|0]})}
 if(Math.random()<.35)P.push({x:Math.random()*W,y:-10,vx:(Math.random()-.5)*1.5,vy:2+Math.random()*2,l:400,c:cols[Math.random()*7|0],cf:1,a:Math.random()*6});
 g.clearRect(0,0,W,Hh);
 Rk=Rk.filter(r=>{r.y+=r.vy;r.vy+=.12;g.fillStyle=r.c;g.fillRect(r.x-2,r.y,4,12);
  if(r.vy>-1.5){for(let i=0;i<70;i++){const a=Math.random()*6.28,sp=1+Math.random()*5;P.push({x:r.x,y:r.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:60+Math.random()*30,c:r.c})}if(st.bgm)pop();return false}return true});
 P=P.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.l--;g.globalAlpha=Math.min(1,p.l/40);g.fillStyle=p.c;
  if(p.cf){p.a+=.1;g.fillRect(p.x,p.y,8,4+3*Math.sin(p.a))}else{p.vy+=.06;p.vx*=.98;g.fillRect(p.x,p.y,3,3)}
  return p.l>0&&p.y<Hh+20});
 g.globalAlpha=1;requestAnimationFrame(fxLoop)}
// 축하 음악: Web Audio 자작 팡파르 + 경쾌한 반복 (저작권 문제 없음)
let awT=null;
function tone(f,t,d,type,vol){const o=ac.createOscillator(),fl=ac.createBiquadFilter(),g=ac.createGain();o.type=type||"sawtooth";o.frequency.value=f;fl.type="lowpass";fl.frequency.value=2200;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.09,t+.02);g.gain.setValueAtTime(vol||.09,t+d*.7);g.gain.exponentialRampToValueAtTime(.001,t+d);
 o.connect(fl);fl.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02)}
function pop(){try{const t=ac.currentTime,n=ac.createBufferSource(),g=ac.createGain();n.buffer=noise;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);n.connect(g);g.connect(ac.destination);n.start(t);n.stop(t+.1)}catch(e){}}
function fanfare(){try{ac=ac||new AudioContext();ac.resume();
 if(!noise){noise=ac.createBuffer(1,ac.sampleRate*.1,ac.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
 const t0=ac.currentTime+.05;
 [[392,0,.14],[523,.15,.14],[659,.3,.14],[784,.45,.5],[659,1,.14],[784,1.15,.9]].forEach(([f,s,d])=>{tone(f,t0+s,d);tone(f/1.26,t0+s,d,"sawtooth",.05)});
 [523,659,784,1047].forEach(f=>tone(f,t0+2.2,1.2,"sawtooth",.06));
 const PR=[[262,330,392,523],[349,440,523,698],[392,494,587,784],[262,330,392,523]];let i=0,nt=t0+3.6;
 awT=setInterval(()=>{while(nt<ac.currentTime+.15){const ch=PR[(i>>3)%4],f=ch[[0,1,2,3,2,1,2,3][i%8]];
  tone(f*2,nt,.18,"triangle",.08);if(i%2===0)tone(ch[0]/2,nt,.25,"square",.04);if(i%4===0){const k=ac.createOscillator(),kg=ac.createGain();k.frequency.setValueAtTime(120,nt);k.frequency.exponentialRampToValueAtTime(40,nt+.15);kg.gain.setValueAtTime(.3,nt);kg.gain.exponentialRampToValueAtTime(.001,nt+.2);k.connect(kg);kg.connect(ac.destination);k.start(nt);k.stop(nt+.22)}
  i++;nt+=60/140/2}},30)}catch(e){}}
function awardStop(){fxOn=false;clearInterval(awT);awT=null}
function drawAwBgm(){$("bAwBgm").textContent=st.bgm?"음악 끄기":"음악 켜기"}
$("bAwBgm").onclick=()=>{st.bgm=!st.bgm;save();drawAwBgm();if(st.bgm)fanfare();else{clearInterval(awT);awT=null}};
$("bAward").onclick=award;$("bAwBack").onclick=()=>{drawSetup();show("setup")};
$("bAwNew").onclick=()=>{st.score=[0,0,0,0,0,0];st.used=[];st.prov=[];st.played=[];st.seen=[];st.team=1;save();drawSetup();show("setup")};
drawSetup();show("setup");
// ===== 진행자 화면 =====
// 구조: 게임 화면이 0.2초마다 현재 상태(차례·남은 시간·정답·다음 정답)를 진행자 화면에 보내고,
//       진행자 화면의 버튼은 게임 화면의 정답·패스·힌트 기능을 그대로 실행한다.
// 연결: ① 팝업 창(같은 브라우저에서 직접 연결) ② 주소 끝에 #host를 붙여 연 별도 탭(BroadcastChannel)
const HOSTCSS=`.hostbody{display:block;background:var(--paper)}
.hw{padding:18px;display:flex;flex-direction:column;gap:14px;max-width:640px;margin:0 auto}
.hhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:3px solid var(--ink);padding-bottom:10px}
.hhead b{font-size:22px;font-weight:900}.hhead span{font-size:14px;color:#525a85}
.hrow{display:flex;justify-content:space-between;align-items:center;min-height:60px}
.hteam{font-size:28px;font-weight:900}.htime{font-size:54px;font-weight:900;letter-spacing:-.03em}.htime.warn{color:var(--warn)}
.hcnt{font-size:18px;font-weight:700;text-align:right}
.hmain{background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:18px;text-align:center;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.hmain img{width:150px;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:2px solid #e3e8f1}
.hans{font-size:clamp(40px,9vw,64px);font-weight:900;letter-spacing:-.03em;line-height:1.1;white-space:pre-line}
.hsub{font-size:18px;color:#525a85;font-weight:700}
.hhint{font-size:15px;font-weight:700;color:#8a6200;background:#FFF3CF;border-radius:99px;padding:4px 12px}
.hwait{font-size:28px;font-weight:900}.hmain p{color:#525a85;font-size:16px}
.hnext{font-size:17px;font-weight:700;color:#525a85;text-align:center;min-height:24px}
.hbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.hbtns .act{width:auto;font-size:24px;padding:14px 0}.hbtns .act.plain{background:#fff;font-size:18px}
.hscore{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.hscore div{background:#fff;border:2px solid var(--line);border-radius:10px;padding:4px 12px;font-weight:800}
.hscore div.on{border:3px solid var(--ink)}
.hkeys{font-size:13px;color:#525a85;text-align:center}`;
const HOSTBODY=`<div class="hw"><div class="hhead"><b>진행자 화면</b><span>학생에게 보이지 않는 화면에 두세요</span></div>
<div class="hrow"><div class="hteam" id="hTeam"></div><div class="htime" id="hTime"></div><div class="hcnt" id="hCnt"></div></div>
<div class="hmain" id="hMain"></div><div class="hnext" id="hNext"></div><div class="hbtns" id="hBtns"></div>
<div class="hscore" id="hScore"></div><p class="hkeys">단축키 → 정답 &nbsp; ↓ 패스${typeof hint==="function"?" &nbsp; H 힌트":""}</p></div>`;
const phaseNow=()=>["setup","play","result","award"].find(x=>!$(x).classList.contains("hide"));
function hostSnap(){const p=phaseNow();return{ph:p,team:st.team,teams:st.teams,score:st.score.slice(0,st.teams),left,ok,pass,passMax:st.passMax,
 cur:cur?{w:cur.w,e:cur.e||"",c:cur.c,i:cur.i||""}:null,nx:(p==="play"?deck.slice(0,2):[]).map(x=>x.w.replace("\n"," ")),
 hl:typeof hintLv!=="undefined"?hintLv:-1,done:allDone(),hasHint:typeof hint==="function"}}
function hostCmd(c){const p=phaseNow();
 if(p==="play"){if(c==="ok")correct();else if(c==="pass")skip();else if(c==="hint"&&typeof hint==="function")hint();else if(c==="stop"&&tick)end()}
 else if(p==="setup"&&c==="start")start();else if(p==="result"&&c==="next")$("bNext").click()}
function renderHost(d,s,send){const g=id=>d.getElementById(id);if(!g("hMain"))return;
 g("hTeam").textContent=s.team+"조";g("hTeam").style.color=`var(--t${s.team})`;
 g("hTime").textContent=s.ph==="play"?s.left:"";g("hTime").classList.toggle("warn",s.ph==="play"&&s.left<=10);
 g("hCnt").innerHTML=s.ph==="play"||s.ph==="result"?`정답 ${s.ok}<br>패스 ${s.pass}${s.passMax===99?"":" / "+s.passMax}`:"";
 let m="";
 if(s.ph==="play"&&s.cur)m=`${s.cur.i?`<img src="${s.cur.i}" alt="">`:""}<div class="hans">${s.cur.w}</div><div class="hsub">${s.cur.e?s.cur.e+" · ":""}${s.cur.c}</div>${s.hasHint?`<div class="hhint">힌트 ${s.hl}/3 공개됨</div>`:""}`;
 else if(s.ph==="setup")m=`<div class="hwait">${s.team}조 준비</div><p>시작을 누르면 정답이 여기에 보여요</p>`;
 else if(s.ph==="result")m=`<div class="hwait">${s.team}조 끝</div><p>정답 ${s.ok}개 · 패스 ${s.pass}개</p>`;
 else if(s.ph==="award")m=`<div class="hwait">시상식 중</div>`;
 if(g("hMain").dataset.k!==m){g("hMain").innerHTML=m;g("hMain").dataset.k=m}
 g("hNext").textContent=s.nx.length?"다음 정답: "+s.nx.join(", "):"";
 const B={setup:[["start","시작","act ok"]],play:[["ok","정답","act ok"],["pass","패스","act pass"]].concat(s.hasHint?[["hint","힌트","act hint"]]:[],[["stop","이번 차례 끝내기","act plain"]]),
  result:[["next",s.done?"시상식 보기":"다음 조 준비","act ok"]],award:[]}[s.ph]||[];
 const bk=B.map(b=>b.join()).join("|");
 if(g("hBtns").dataset.k!==bk){g("hBtns").innerHTML="";B.forEach(([c,t,cls])=>{const b=d.createElement("button");b.className=cls;b.textContent=t;b.dataset.c=c;b.onclick=()=>send(c);g("hBtns").appendChild(b)});g("hBtns").dataset.k=bk}
 const pb=g("hBtns").querySelector('[data-c="pass"]');if(pb)pb.disabled=s.pass>=s.passMax;
 const hb=g("hBtns").querySelector('[data-c="hint"]');if(hb)hb.disabled=s.hl>=3;
 g("hScore").innerHTML=s.score.map((v,i)=>`<div class="${i+1===s.team?"on":""}"><span style="color:var(--t${i+1})">${i+1}조</span> ${v}</div>`).join("");}
function hostKey(send){return e=>{if(e.key==="ArrowRight"||e.key==="Enter"){e.preventDefault();send("ok")}else if(e.key==="ArrowDown"||e.key===" "){e.preventDefault();send("pass")}else if(e.key==="h"||e.key==="H")send("hint")}}
let hostWin=null,lastSnap="",bc=null;try{bc=new BroadcastChannel("host_"+document.title)}catch(e){}
function openHost(){let ok=false;
 try{hostWin=window.open("","host_"+document.title.replace(/\s/g,""),"popup,width=620,height=900");
  if(hostWin){const d=hostWin.document;d.open();d.write(`<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>진행자 화면 - ${document.title}</title><style>${document.querySelector("style").textContent}${HOSTCSS}</style></head><body class="hostbody">${HOSTBODY}</body></html>`);d.close();
   d.addEventListener("keydown",hostKey(hostCmd));lastSnap="";pushHost();hostWin.focus();ok=true}}catch(e){}
 $("hostMsg").textContent=ok?"진행자 화면을 열었어요. 노트북 화면으로 옮겨 두세요.":"팝업이 막혔어요. 주소창의 팝업 차단 표시에서 '항상 허용'을 고른 뒤 다시 눌러 주세요."}
function pushHost(){const s=hostSnap(),j=JSON.stringify(s);if(j===lastSnap)return;lastSnap=j;
 if(hostWin&&!hostWin.closed)try{renderHost(hostWin.document,s,hostCmd)}catch(e){}
 if(bc)bc.postMessage({snap:s})}
if(location.hash==="#host"){ // 이 탭을 진행자 화면으로 사용
 const send=c=>bc&&bc.postMessage({cmd:c});
 document.title="진행자 화면 - "+document.title;document.body.className="hostbody";document.body.innerHTML=HOSTBODY;
 const stl=document.createElement("style");stl.textContent=HOSTCSS;document.head.appendChild(stl);
 if(bc){bc.onmessage=e=>{if(e.data&&e.data.snap)renderHost(document,e.data.snap,send)};bc.postMessage({hello:1})}
 document.getElementById("hMain").innerHTML='<div class="hwait">게임 화면 연결 중…</div><p>같은 브라우저에서 게임 화면을 열어 두세요</p>';
 document.addEventListener("keydown",hostKey(send));
}else{
 if(bc)bc.onmessage=e=>{if(!e.data)return;if(e.data.cmd)hostCmd(e.data.cmd);if(e.data.hello){lastSnap="";pushHost()}};
 setInterval(pushHost,200);
 $("bHost").onclick=openHost;$("bHost2").onclick=openHost;
}
</script></body></html>
